<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}MegaPromoOz{% endblock %} · painel</title>
  <link rel="icon" href="/static/favicon-48.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon-180.png">
  <link rel="stylesheet" href="/static/app.css?v=13">
</head>
<body>
{% if ctx %}
<header class="topo">
  <span class="marca">MegaPromo<b>Oz</b></span>
  <nav>
    <a href="/">Fila</a>
    <a href="/links">Links</a>
    <a href="/postar">Postar</a>
    <a href="/grupos">Grupos</a>
    <a href="/convites">Convites</a>
    <a href="/vigiar">Vigiar</a>
    <a href="/numero">Número</a>
    <a href="/operadores">Operadores</a>
    <a href="/nichos">Nichos</a>
    <a href="/saude">Saúde</a>
  </nav>
  <form method="post" action="/logout">
    <input type="hidden" name="csrf" value="{{ ctx.csrf_token }}">
    <button class="sair" type="submit">Sair</button>
  </form>
</header>
{% endif %}
<main>
{% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
