[project]
name = "megapromooz"
version = "0.1.0"
description = "MegaPromoOz - inteligência de ofertas de afiliado (coletor, histórico de preço, nota, distribuição)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]
extend-exclude = ["probes", "brand"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = [
    "S101",  # assert is fine in tests
    "B008",  # Depends()/Security() defaults are the FastAPI idiom
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]
"tests/*" = ["S105", "S106", "S108", "S311"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
disallow_untyped_decorators = false
exclude = ["migrations/", "probes/", "brand/"]

[[tool.mypy.overrides]]
module = ["asyncmy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]
# Como em produção: com INFO ligado, cada logger.info monta o LogRecord (um `extra` com nome
# reservado, como "created", só quebra assim).
log_level = "INFO"
