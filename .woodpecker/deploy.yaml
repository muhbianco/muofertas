# Push no main = deploy da MegaPromoOz. Tag imutável = sha12 do commit (MEGAPROMOOZ_TAG).
# Ordem: build da imagem → migração one-shot (expand first) → StackUpdate do Portainer com o YAML
# do repo e a tag nova (dry-run antes) → espera os 2 serviços na tag.
# Segredos: /root/.megapromooz.env (migração) e /root/.portainer-token (Portainer), do host.
when:
  - event: push
    branch: main

depends_on: [ci]

clone:
  git:
    image: woodpeckerci/plugin-git:2.10.1
    settings:
      depth: 50
      partial: false

steps:
  build:
    image: muhrilobianco/ci-deployer:1
    pull: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/root/.docker/config.json:ro
    commands:
      - hel1-build --image muhrilobianco/megapromooz --tag ${CI_COMMIT_SHA:0:12} --context . --extra-tag latest

  deploy:
    image: muhrilobianco/ci-deployer:1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/root/.docker/config.json:ro
      - /var/lib/hel1-deploy:/var/lib/hel1-deploy
      - /root/.megapromooz.env:/root/.megapromooz.env:ro
      - /root/.portainer-token:/root/.portainer-token:ro
    environment:
      PORTAINER_URL: https://portainer.muhbianco.com.br
    commands:
      - >-
        hel1-deploy exec --app megapromooz --tag ${CI_COMMIT_SHA:0:12}
        --wait-services megapromooz_megapromooz-web,megapromooz_megapromooz-worker
        -- infra/scripts/deploy.sh ${CI_COMMIT_SHA:0:12}
